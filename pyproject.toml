[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-vlc"
version = "0.1.0"
description = "Control VLC playback (music and video) from the command line, for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-vlc = "ai_vlc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_vlc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
